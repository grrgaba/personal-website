<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mortgage Calculator — nicodimaano.com</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body>
  <div id="site-header-placeholder"></div>

  <main>
    <section class="hero container">
      <h1 class="name">Mortgage Calculator</h1>
      <p class="bio">Estimate your payments, total interest, and how the loan term affects the cost.</p>
    </section>

    <section class="container">
      <div class="calc-grid">
        <div class="card">
          <h3>Mortgage Inputs</h3>
          <div class="two-inputs">
            <label>Home Price
              <div class="num-controls">
                <input id="homePrice" type="text" inputmode="numeric" value="$500,000">
                <button type="button" class="step-btn" data-target="homePrice" data-delta="100" aria-label="Increase home price">+</button>
                <button type="button" class="step-btn" data-target="homePrice" data-delta="-100" aria-label="Decrease home price">−</button>
              </div>
            </label>
            <label>Annual Interest Rate
              <div class="num-controls">
                <input id="annualRate" type="number" min="0" step="0.01" value="3.5">
                <button type="button" class="step-btn" data-target="annualRate" data-delta="0.01" aria-label="Increase interest rate">+</button>
                <button type="button" class="step-btn" data-target="annualRate" data-delta="-0.01" aria-label="Decrease interest rate">−</button>
              </div>
            </label>
          </div>

          <label>Down Payment <span id="dpPercentText">20%</span>
            <div class="slider-controls">
              <button type="button" class="decrease" id="downMinus">−</button>
              <input id="downPercent" type="range" min="0" max="100" value="20">
              <button type="button" class="increase" id="downPlus">+</button>
            </div>
          </label>

          <label>Loan Term (<span id="termYearsText">25 yrs</span>)
            <div class="slider-controls">
              <button type="button" class="decrease" id="termMinus">−</button>
              <input id="termYears" type="range" min="1" max="40" step="1" value="25">
              <button type="button" class="increase" id="termPlus">+</button>
            </div>
          </label>

          <div class="interval-group">
            <span style="font-weight:600">Payment Interval</span>
            <label style="font-weight:400;margin-left:0.5rem"><input type="radio" name="interval" id="intervalMonthly" value="monthly" checked> Monthly</label>
            <label style="font-weight:400;margin-left:0.5rem"><input type="radio" name="interval" id="intervalBiweekly" value="biweekly"> Bi-weekly</label>
          </div>

          <p id="termNotice" role="status" style="display:none;margin:0.5rem 0;padding:0.5rem 0.75rem;border-radius:6px;background:#fff7e0;border:1px solid #f5d57a;color:#7a5a00;font-size:0.9rem"></p>

          <button id="calcBtn" class="cta">Calculate Mortgage</button>
        </div>

        <div>
          <div class="card results" id="resultsCard">
            <h3>Results</h3>
            <p><strong>Down Payment:</strong> <span id="downDollar" class="val">—</span><span class="trend" id="arrow-down"></span></p>
            <p><strong>Loan Amount:</strong> <span id="loanAmount" class="val">—</span><span class="trend" id="arrow-loan"></span></p>
            <p><strong>Payment (<span id="intervalLabel">Monthly</span>):</strong>             <span id="monthly">—</span><span class="trend" id="arrow-monthly"></span></p>
                        <p><strong>Total Principal Paid:</strong> <span id="principal">—</span><span class="trend" id="arrow-principal"></span></p>
                        <p><strong>Total Interest Paid:</strong> <span id="interest">—</span><span class="trend" id="arrow-interest"></span></p>
                        <p><strong>Estimated Total Payment:</strong> <span id="totalPay">—</span><span class="trend" id="arrow-totalPay"></span></p>
          </div>

          <div class="card">
            <h3>Breakdown</h3>
            <canvas id="breakdownChart" height="150"></canvas>
          </div>
        </div>
      </div>
    </section>

    <style>
      .calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
      .calc-grid .card::before{display:none}
      .calc-grid .card p{color:inherit}
      .calc-grid .card label{display:block;margin:0.5rem 0;font-weight:600}
      .calc-grid .card input[type=number],.calc-grid .card input[type=text]{width:100%;padding:0.5rem;border:1px solid #e6eef7;border-radius:6px}
      .dp-row{display:flex;gap:0.5rem;margin-bottom:0.5rem}
      .interval-group{display:flex;gap:0.5rem;align-items:center;margin:0.5rem 0}
      .dp-row input{flex:1}
      .two-inputs{display:flex;gap:0.5rem;align-items:flex-start}
      .two-inputs>label{flex:1;max-width:260px;display:block}
      .two-inputs input{width:100%}
      .num-controls{display:flex;gap:0.25rem;align-items:center}
      .num-controls input{flex:1;min-width:0}
      .step-btn{width:30px;height:30px;padding:0;border-radius:6px;border:2px solid #94a3b8;background:#fff;cursor:pointer;line-height:1;font-size:1.1rem;font-weight:600}
      .step-btn:hover{background:#f1f5f9;border-color:#64748b}
      .slider-controls{display:flex;gap:0.5rem;align-items:center}
      .slider-controls button{width:32px;height:32px;border-radius:6px;border:1px solid #e6eef7;background:#fff;cursor:pointer}
      .slider-controls input[type=range]{flex:1}
      /* constrain chart size so it doesn't grow beyond the template */
      @keyframes trendFade{0%,30%{opacity:1}100%{opacity:0}}
      .trend{display:inline-block;margin-left:0.4rem;font-size:0.95rem;opacity:0;animation:trendFade 2.5s ease-out forwards}
      .trend.up{color:#dc2626}
      .trend.down{color:#16a34a}
      @keyframes flashRed{0%,30%{color:#dc2626}100%{color:inherit}}
      @keyframes flashGreen{0%,30%{color:#16a34a}100%{color:inherit}}
      .val.flash-up{animation:flashRed 2.5s ease-out forwards}
      .val.flash-down{animation:flashGreen 2.5s ease-out forwards}
      #breakdownChart{max-height:150px;height:150px;display:block;width:100%;}
      @media(max-width:800px){.calc-grid{grid-template-columns:1fr}}
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      // header dropdown active link highlight + submenu toggle
      (function(){
        const path = location.pathname.replace(/\/+$/,'') || '/';
        document.querySelectorAll('.nav-links a').forEach(a=>{
          try{
            const href = new URL(a.href).pathname.replace(/\/+$/,'') || '/';
            if(path === href || path.startsWith(href)) a.classList.add('active');
          }catch(e){}
        });

        // bind submenu behavior only for list items that actually contain a .submenu
        document.querySelectorAll('.nav-links li').forEach(li=>{
          const submenu = li.querySelector('.submenu');
          if(!submenu) return;
          const a = li.querySelector('a');
          if(!a) return;
          a.setAttribute('aria-haspopup','true');
          a.setAttribute('aria-expanded','false');
          a.addEventListener('click', function(e){
            const isOpen = li.classList.contains('open');
            if(!isOpen){
              li.classList.add('open');
              a.setAttribute('aria-expanded','true');
              e.preventDefault();
            }
          });
        });
        document.addEventListener('click', function(e){
          if(!e.target.closest('.nav-links')){
            document.querySelectorAll('.nav-links li.open').forEach(li=>{
              li.classList.remove('open');
              const link = li.querySelector('a'); if(link) link.setAttribute('aria-expanded','false');
            });
          }
        });
        document.addEventListener('keydown', function(e){
          if(e.key === 'Escape'){
            document.querySelectorAll('.nav-links li.open').forEach(li=>{
              li.classList.remove('open');
              const link = li.querySelector('a'); if(link) link.setAttribute('aria-expanded','false');
            });
          }
        });
      })();

      // Mortgage calculator logic
      const $ = id=>document.getElementById(id);
      const homePrice = $('homePrice');
      const downPercent = $('downPercent');
      const dpPercentText = $('dpPercentText');
      const downDollar = $('downDollar');
      const loanAmount = $('loanAmount');
      const annualRate = $('annualRate');
      const termYears = $('termYears');
      const termYearsText = $('termYearsText');
      const calcBtn = $('calcBtn');
      const intervalLabelElem = $('intervalLabel');
      const downMinus = $('downMinus');
      const downPlus = $('downPlus');
      const termMinus = $('termMinus');
      const termPlus = $('termPlus');
      let myChart = null;

      function getInterval(){
        const el = document.querySelector('input[name="interval"]:checked');
        return el ? el.value : 'monthly';
      }

      function parseMoney(s){ return parseInt(String(s).replace(/[^0-9]/g,''), 10) || 0; }
      function formatMoneyInput(n){ return '$' + n.toLocaleString('en-US'); }
      homePrice.addEventListener('input', function(){
        const digits = homePrice.value.replace(/[^0-9]/g,'');
        homePrice.value = digits ? formatMoneyInput(parseInt(digits, 10)) : '';
      });

      function formatCurrency(v){ return v.toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:2}); }

      function updateDerived(){
        const price = parseMoney(homePrice.value);
        const pct = Number(downPercent.value) || 0;
        dpPercentText.textContent = pct + '%';
        const down = Math.round(price * pct/100);
        downDollar.textContent = formatCurrency(down);
        const loan = Math.max(0, price - down);
        loanAmount.textContent = formatCurrency(loan);
        return {price,down,loan};
      }

      downPercent.addEventListener('input', updateDerived);
      homePrice.addEventListener('input', updateDerived);
      // update term text on slider change
      function termText(v){ return (Math.round(v*10)/10) + ' yrs'; }
      if(termYearsText) termYearsText.textContent = termText(termYears.value);
      termYears.addEventListener('input', function(){ if(termYearsText) termYearsText.textContent = termText(termYears.value); });
      updateDerived();

      // term (in yrs) the user chose in monthly mode; bi-weekly auto-adjusts from it
      let baseYears = Number(termYears.value);
      let lastInterval = getInterval();
      let lastValues = null;

      function setTerm(v){
        termYears.value = v;
        if(termYearsText) termYearsText.textContent = termText(v);
      }

      // years to pay off with an accelerated bi-weekly payment (half the monthly payment)
      function adjustedYears(principal, annual, years){
        const nominal = annual/100;
        const rM = Math.pow(1 + nominal/2, 2/12) - 1;
        const rB = Math.pow(1 + nominal/2, 2/26) - 1;
        const months = Math.max(1, years*12);
        if(principal <= 0) return years;
        if(rM <= 0) return years;
        const monthly = principal * rM / (1 - Math.pow(1 + rM, -months));
        const pay = monthly/2;
        const n = -Math.log(1 - principal*rB/pay) / Math.log(1 + rB);
        return n/26;
      }

      function flashArrow(key, diff){
        const el = $('arrow-'+key);
        if(!el || Math.abs(diff) < 0.005) return;
        const cls = diff > 0 ? 'up' : 'down';
        el.textContent = diff > 0 ? '▲' : '▼';
        el.className = 'trend ' + cls;
        const num = el.previousElementSibling;
        if(num) num.className = 'val flash-' + cls;
        [el, num].forEach(n=>{ if(n){ n.style.animation = 'none'; } });
        void el.offsetWidth;
        [el, num].forEach(n=>{ if(n){ n.style.animation = ''; } });
      }

      function calculate(){
        const {loan, down} = updateDerived();
        const principal = loan;
        const annual = parseFloat(annualRate.value) || 0;
        const interval = getInterval();
        const years = Math.max(0, parseFloat(termYears.value)||0);
        const periodsPerYear = interval === 'biweekly' ? 26 : 12;
        const periods = Math.max(1, Math.round(years * periodsPerYear));
        // Convert nominal annual rate (semi-annual compounding) to effective periodic rate
        const nominal = annual/100;
        const r = Math.pow(1 + nominal/2, 2/periodsPerYear) - 1;
        let payment = 0;
        if(r>0){ payment = principal * (r / (1 - Math.pow(1 + r, -periods))); }
        else{ payment = principal / periods; }
        if(intervalLabelElem) intervalLabelElem.textContent = interval === 'biweekly' ? 'Bi-weekly (accelerated)' : 'Monthly';
        // build amortization schedule (labels = payment number)
        const labels = [];
        const principalOwed = [];
        const cumulativeInterest = [];
        let balance = principal;
        let cumInt = 0;
        let finalPeriods = periods;
        for(let i=1;i<=periods;i++){
          const interestPayment = balance * r;
          let principalPayment = payment - interestPayment;
          if(principalPayment > balance) principalPayment = balance;
          balance = Math.max(0, balance - principalPayment);
          cumInt += interestPayment;
          labels.push(i.toString());
          principalOwed.push(balance);
          cumulativeInterest.push(cumInt);
          if(balance <= 0.005){ finalPeriods = i; break; }
        }
        const totalInterest = cumInt;
        const totalPayment = principal + totalInterest;

        $('monthly').textContent = formatCurrency(payment);
        $('principal').textContent = formatCurrency(principal);
        $('interest').textContent = formatCurrency(totalInterest);
        $('totalPay').textContent = formatCurrency(totalPayment);

        const values = {down:down, loan:loan, monthly:payment, principal:principal, interest:totalInterest, totalPay:totalPayment};
        if(lastValues){
          Object.keys(values).forEach(k=>flashArrow(k, values[k]-lastValues[k]));
        }
        lastValues = values;

        const notice = $('termNotice');
        if(notice){
          if(interval === 'biweekly' && principal > 0){
            notice.textContent = 'Loan Term Adjusted for converting: ' + termText(baseYears) + ' → ' + termText(years) + ' (' + finalPeriods + ' bi-weekly payments)';
            notice.style.display = 'block';
          } else {
            notice.style.display = 'none';
          }
        }

        if(typeof Chart === 'undefined') return;
        const ctx = document.getElementById('breakdownChart').getContext('2d');
        const data = {
          labels: labels,
          datasets: [
            {label:'Principal Owed',data:principalOwed,borderColor:'#10b981',backgroundColor:'transparent',fill:false,tension:0.2,pointRadius:0},
            {label:'Cumulative Interest',data:cumulativeInterest,borderColor:'#0b5fff',backgroundColor:'transparent',fill:false,tension:0.2,pointRadius:0}
          ]
        };

        const options = {
          responsive:true,
          maintainAspectRatio:true,
          plugins:{legend:{position:'bottom'}},
          scales:{
            x:{display:true,title:{display:true,text:'Payment #'}},
            y:{display:true,title:{display:true,text:'Dollars'},ticks:{beginAtZero:true}}
          }
        };

        if(myChart) myChart.destroy();
        myChart = new Chart(ctx,{type:'line',data,options});
      }

      // live updates: slider and inputs
      downPercent.addEventListener('input', calculate);
      homePrice.addEventListener('input', calculate);
      annualRate.addEventListener('input', calculate);
      termYears.addEventListener('input', function(){
        if(getInterval() === 'monthly') baseYears = Number(termYears.value);
        calculate();
      });
      calcBtn.addEventListener('click', calculate);
      document.querySelectorAll('input[name="interval"]').forEach(r=>r.addEventListener('change', function(){
        const interval = getInterval();
        if(interval === lastInterval) return;
        lastInterval = interval;
        if(interval === 'biweekly'){
          const {loan} = updateDerived();
          baseYears = Number(termYears.value);
          termYears.step = 0.1;
          const adj = adjustedYears(loan, parseFloat(annualRate.value) || 0, baseYears);
          setTerm(Math.min(Number(termYears.max), Math.max(Number(termYears.min), Math.round(adj*10)/10)));
        } else {
          termYears.step = 1;
          setTerm(Math.round(baseYears));
        }
        calculate();
      }));
      // slider +/- buttons
      if(downMinus) downMinus.addEventListener('click', function(){
        const min = Number(downPercent.min) || 0;
        let v = Number(downPercent.value) || 0;
        v = Math.max(min, v - 1);
        downPercent.value = v;
        updateDerived();
        calculate();
      });
      if(downPlus) downPlus.addEventListener('click', function(){
        const max = Number(downPercent.max) || 100;
        let v = Number(downPercent.value) || 0;
        v = Math.min(max, v + 1);
        downPercent.value = v;
        updateDerived();
        calculate();
      });
      if(termMinus) termMinus.addEventListener('click', function(){
        const min = Number(termYears.min) || 1;
        let v = Number(termYears.value) || min;
        v = Math.max(min, v - 1);
        setTerm(v);
        if(getInterval() === 'monthly') baseYears = v;
        calculate();
      });
      if(termPlus) termPlus.addEventListener('click', function(){
        const max = Number(termYears.max) || 40;
        let v = Number(termYears.value) || 1;
        v = Math.min(max, v + 1);
        setTerm(v);
        if(getInterval() === 'monthly') baseYears = v;
        calculate();
      });

      // +/- buttons for home price and interest rate
      document.querySelectorAll('.step-btn').forEach(btn=>{
        btn.addEventListener('click', function(){
          const input = $(btn.dataset.target);
          const delta = Number(btn.dataset.delta);
          if(input === homePrice){
            input.value = formatMoneyInput(Math.max(0, parseMoney(input.value) + delta));
          } else {
            const next = Math.max(0, (parseFloat(input.value) || 0) + delta);
            input.value = Math.round(next * 100) / 100;
          }
          input.dispatchEvent(new Event('input'));
        });
      });

      // initial calculation (after all listeners are attached)
      calculate();
    </script>
  </main>

  <div id="site-footer-placeholder"></div>
  <script src="/includes/loader.js"></script>
</body>
</html>
